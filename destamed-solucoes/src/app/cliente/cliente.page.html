<app-header title="Clientes" color="secondary"></app-header>


<ion-content class="ion-padding">
  <ion-searchbar placeholder="Buscar clientes" (ionInput)="onSearchChange($event.detail.value)"></ion-searchbar>

  <ion-list>
    <ion-item *ngFor="let cliente of clientes" lines="full">
      <ion-icon name="person-circle-outline" slot="start" color="primary"></ion-icon>
      <ion-label>
        <strong>{{ cliente.codCliente }}</strong>
        <ion-text class="ion-text-uppercase">{{ cliente.nomeFantasia }}</ion-text>
        <ion-note color="medium" class="ion-text-wrap">
          {{ cliente.representante }}
        </ion-note>
      </ion-label>
      <div class="metadata-end-wrapper" slot="end">
        <ion-note color="medium">{{ cliente.createdAt | date: 'dd/MM/yyyy' }}</ion-note>
      </div>
    </ion-item>
  </ion-list>

  <ion-item *ngIf="clientes.length === 0">
    <ion-label class="ion-text-center">Nenhum cliente encontrado!</ion-label>
  </ion-item>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button color="primary" (click)="adicionarCliente()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
