<app-header title="Contratos" color="secondary"></app-header>

<ion-content class="ion-padding">
  <ion-searchbar placeholder="Buscar contratos" (ionInput)="onSearchChange($event.detail.value)"></ion-searchbar>

  <ion-list>
    <ion-item *ngFor="let contrato of contratos">
      <ion-icon name="briefcase-outline" slot="start" color="primary"></ion-icon>
      <ion-label>
        <strong>{{ contrato.codContrato }}</strong>
        <p>{{ contrato.cliente.nomeFantasia }}</p>
        <ion-note>{{ contrato.unidade.nomeFantasia }}</ion-note>
      </ion-label>
      <ion-note slot="end">{{ contrato.createdAt | date: 'dd/MM/yyyy' }}</ion-note>
    </ion-item>
  </ion-list>

  <ion-item *ngIf="contratos.length === 0">
    <ion-label class="ion-text-center">Nenhum contrato encontrado.</ion-label>
  </ion-item>
</ion-content>
