<app-header title="Propostas e Contratos" color="secondary"></app-header>

<ion-content class="ion-padding">
  <ion-grid>
    <ion-row>
      <ion-col size="12" size-md="6" size-lg="3" *ngFor="let card of cards">
        <ion-card class="metric-card" [color]="card.color" button="true" (click)="irPara(card.route)">
          <ion-card-content>
            <div class="metric-top">
              <ion-icon [name]="card.icon" size="large"></ion-icon>
              <span>{{ card.title }}</span>
            </div>
            <h3>{{ card.value }}</h3>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
