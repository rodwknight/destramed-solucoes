<app-header title="Nova empresa" color="secondary"></app-header>


<ion-content class="ion-padding">
  <form [formGroup]="empresaForm" (ngSubmit)="submit()">
    <ion-card>
      <ion-card-content>
        <ion-item>
          <ion-label position="stacked">Nome</ion-label>
          <ion-input formControlName="nome" placeholder="Nome da empresa"></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">Razão Social</ion-label>
          <ion-input formControlName="razaoSocial" placeholder="Razão social"></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">CNPJ</ion-label>
          <ion-input formControlName="cnpj" placeholder="00.000.000/0000-00"></ion-input>
        </ion-item>

        <ion-button expand="block" type="submit" class="ion-margin-top" [disabled]="empresaForm.invalid">
          Salvar empresa
        </ion-button>
      </ion-card-content>
    </ion-card>
  </form>
</ion-content>
