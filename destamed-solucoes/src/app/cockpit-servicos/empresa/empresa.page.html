<app-header title="Empresas" color="secondary"></app-header>


<ion-content class="ion-padding">
  <ion-searchbar placeholder="Buscar empresas" (ionInput)="onSearchChange($event.target.value)"></ion-searchbar>

  <ion-list>
    <ion-item *ngFor="let empresa of empresas" lines="full">
      <ion-icon name="business-outline" slot="start" color="primary"></ion-icon>
      <ion-label>
        <strong>{{ empresa.id }}</strong>
        <ion-text>{{ empresa.nome }}</ion-text>
        <ion-note color="medium" class="ion-text-wrap">
          {{ empresa.razaoSocial }}
        </ion-note>
      </ion-label>
      <div class="metadata-end-wrapper" slot="end">
        <ion-note color="medium">{{ empresa.createdAt | date: 'dd/MM/yyyy' }}</ion-note>
      </div>
    </ion-item>
  </ion-list>

  <ion-item *ngIf="empresas.length === 0">
    <ion-label class="ion-text-center">Nenhuma empresa encontrada!</ion-label>
  </ion-item>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button color="primary" (click)="adicionarEmpresa()">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
