<app-header title="Ordens" color="secondary"></app-header>

<ion-content class="ion-padding">
  <ion-searchbar placeholder="Buscar ordens" (ionInput)="onSearchChange($event.detail.value)"></ion-searchbar>

  <ion-list>
    <ion-item *ngFor="let ordem of ordens" lines="full">
      <ion-icon name="file-tray-full-outline" slot="start" color="primary"></ion-icon>
      <ion-label (click)="detalheOrdem(ordem)">
        <h2>{{ ordem.codOrdem }}</h2>
        <p>{{ ordem.cliente.codCliente }} - {{ ordem.cliente.nomeFantasia }}</p>
        <p>{{ ordem.unidade.codUnidade }} - {{ ordem.unidade.nomeFantasia }}</p>
        <ion-note color="medium">{{ ordem.usuario.nome }} · {{ ordem.createdAt | date: 'dd/MM/yyyy' }}</ion-note>
      </ion-label>
      <ion-badge slot="end" [color]="typeStatus(ordem.status)">{{ labelStatus(ordem.status) }}</ion-badge>
      <ion-button
        *ngIf="ordem.status === 1"
        slot="end"
        fill="clear"
        aria-label="Iniciar ordem"
        (click)="iniciar(ordem)">
        <ion-icon name="play" slot="icon-only"></ion-icon>
      </ion-button>
      <ion-button
        *ngIf="ordem.status === 2"
        slot="end"
        fill="clear"
        aria-label="Finalizar ordem"
        (click)="finalizar(ordem)">
        <ion-icon name="checkmark" slot="icon-only"></ion-icon>
      </ion-button>
      <ion-button
        *ngIf="ordem.status === 1 || ordem.status === 2"
        slot="end"
        fill="clear"
        color="danger"
        aria-label="Cancelar ordem"
        (click)="cancelar(ordem)">
        <ion-icon name="close" slot="icon-only"></ion-icon>
      </ion-button>
    </ion-item>
  </ion-list>

  <ion-item *ngIf="ordens.length === 0">
    <ion-label class="ion-text-center">Nenhuma ordem encontrada.</ion-label>
  </ion-item>

  <ion-fab vertical="bottom" horizontal="end" slot="fixed">
    <ion-fab-button (click)="adicionarOrdem()" aria-label="Criar ordem">
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
  </ion-fab>
</ion-content>
