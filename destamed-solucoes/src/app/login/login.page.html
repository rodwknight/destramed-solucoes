<ion-content [fullscreen]="true" class="login-page">
  <div class="login-shell">
    <ion-card class="login-card">
      <ion-card-header class="ion-text-center">
        <div class="brand-wrap">
          <div class="brand-mark">D</div>
        </div>
        <ion-card-title>Destamed Soluções</ion-card-title>
        <ion-card-subtitle>Cockpit de gestão</ion-card-subtitle>
      </ion-card-header>

      <ion-card-content>
        <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
          <ion-item lines="none" class="input-item">
            <ion-label position="stacked">Empresa</ion-label>
            <ion-select formControlName="empresa" interface="popover" placeholder="Selecione a empresa">
              <ion-select-option *ngFor="let empresa of empresas" [value]="empresa">
                {{ empresa.nome }}
              </ion-select-option>
            </ion-select>
          </ion-item>

          <ion-item lines="none" class="input-item">
            <ion-label position="stacked">Usuário</ion-label>
            <ion-input formControlName="username" placeholder="Digite seu usuário"></ion-input>
          </ion-item>

          <ion-item lines="none" class="input-item">
            <ion-label position="stacked">Senha</ion-label>
            <ion-input formControlName="password" type="password" placeholder="Digite sua senha"></ion-input>
          </ion-item>

          <ion-button expand="block" type="submit" class="submit-button">Entrar</ion-button>
        </form>
      </ion-card-content>
    </ion-card>
  </div>
</ion-content>
