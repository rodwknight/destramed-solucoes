<ion-menu menuId="main-menu" contentId="main-content" side="start" type="overlay">
  <ion-header>
    <ion-toolbar color="secondary">
      <ion-title>Destamed Soluções</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-content>
    <ion-list lines="none" class="menu-items">
      <ion-item
        *ngFor="let item of menuItems"
        button
        detail="false"
        (click)="navigateTo(item.route)">
        <ion-icon [name]="item.icon" slot="start" color="primary"></ion-icon>
        <ion-label>{{ item.title }}</ion-label>
      </ion-item>
    </ion-list>
  </ion-content>

  <ion-footer>
    <ion-list lines="none">
      <ion-item button detail="false" (click)="navigateTo('/configuracao')">
        <ion-icon name="settings-outline" slot="start" color="medium"></ion-icon>
        <ion-label>Configurações</ion-label>
      </ion-item>
      <ion-item button detail="false" (click)="logout()">
        <ion-icon name="log-out-outline" slot="start" color="medium"></ion-icon>
        <ion-label>Sair</ion-label>
      </ion-item>
    </ion-list>
  </ion-footer>
</ion-menu>
