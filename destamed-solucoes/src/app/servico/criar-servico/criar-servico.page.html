<app-header title="Novo serviço" color="secondary"></app-header>


<ion-content class="ion-padding">
  <form [formGroup]="servicoForm" (ngSubmit)="submit()">
    <ion-card>
      <ion-card-content>
        <ion-item>
          <ion-label position="stacked">Nome</ion-label>
          <ion-input formControlName="nome" placeholder="Nome do serviço"></ion-input>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">Descrição</ion-label>
          <ion-textarea formControlName="descricao" rows="3" placeholder="Descrição do serviço"></ion-textarea>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">Descrição para proposta</ion-label>
          <ion-textarea formControlName="descricaoProposta" rows="3" placeholder="Texto para proposta"></ion-textarea>
        </ion-item>

        <ion-item>
          <ion-label position="stacked">Valor</ion-label>
          <ion-input formControlName="valor" type="number" placeholder="500"></ion-input>
        </ion-item>

        <ion-button expand="block" type="submit" class="ion-margin-top" [disabled]="servicoForm.invalid">
          Salvar serviço
        </ion-button>
      </ion-card-content>
    </ion-card>
  </form>
</ion-content>
